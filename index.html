<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BRICK//RUN — Neon Escape</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--cyan:#62f5e1;--pink:#ff5a9e;--ink:#07101c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b14;color:#e8f4f4;font-family:'Space Grotesk',sans-serif}body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,1280px);height:min(100vh,800px);aspect-ratio:16/10;background:#091320;overflow:hidden;box-shadow:0 20px 100px #000a;border:1px solid #203448}.game{display:block;width:100%;height:100%;touch-action:none}.scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,#fff0 0 3px,#c6ffff05 4px);mix-blend-mode:screen;opacity:.34}.vignette{pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 100px #020711aa}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#07101c33,#07101cbb);backdrop-filter:blur(3px)}.card{width:min(510px,88%);padding:38px 42px;border:1px solid #5cf5df55;background:#081521eF;box-shadow:0 0 60px #28d8c51b;position:relative}.card:before,.card:after{content:'';position:absolute;width:18px;height:18px;border-color:var(--cyan);border-style:solid}.card:before{left:-1px;top:-1px;border-width:2px 0 0 2px}.card:after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}.eyebrow{font:500 11px 'DM Mono',monospace;letter-spacing:.25em;color:var(--cyan);text-transform:uppercase}.title{font-size:clamp(36px,6vw,62px);line-height:.95;letter-spacing:-.07em;margin:15px 0 12px;font-weight:700}.title span{color:var(--cyan)}.desc{color:#9eafbf;font-size:14px;line-height:1.6;margin:0 0 20px}.keys{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 26px}.key{font:11px 'DM Mono',monospace;color:#c5d5df;border:1px solid #34495b;background:#101e2b;padding:7px 10px}.btn{border:0;background:var(--cyan);color:#06121a;padding:14px 20px;font:700 12px 'DM Mono',monospace;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;min-width:190px;transition:.18s}.btn:hover{background:#a5fff4;transform:translateY(-2px);box-shadow:0 6px 24px #62f5e155}.overlay.hidden{display:none}.mobile-tip{display:none}@media(max-width:650px){.shell{width:100vw;height:100dvh;aspect-ratio:auto;border:0}.card{padding:27px 25px}.mobile-tip{display:inline}.desktop-tip{display:none}}
</style>
</head>
<body><main class="shell"><canvas class="game" aria-label="Brick Run game"></canvas><div class="scan"></div><div class="vignette"></div><section class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">A survival arcade game</div><h1 class="title" id="title">BRICK<span>//</span>RUN</h1><p class="desc" id="desc">The walls are closing in. Slip through the gaps, dodge the hostile cores, and take down the guardian waiting at the end of each run.</p><div class="keys"><span class="key desktop-tip">DRAG TO MOVE</span><span class="key mobile-tip">TOUCH + DRAG</span><span class="key">HOLD / SPACE TO FIRE</span><span class="key">SHIFT: DASH</span></div><button class="btn" id="start">START RUN&nbsp; ↗</button></div></section></main>
<script>
(() => {
const canvas=document.querySelector('.game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),startBtn=document.querySelector('#start');
let W=960,H=600,DPR=1,mode='menu',last=0,elapsed=0,level=1,score=0,shake=0,progress=0,levelLength=2700,spawnTimer=0,brickRows=[],balls=[],shots=[],particles=[],boss=null,keys={},pointer={x:480,y:420,down:false},player,invuln=0,dash=0,dashCd=0,fireCd=0,flash=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),colors=['#ff648f','#ffbd5c','#b285ff','#60d8ff'];
function resize(){const r=canvas.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(player){player.x=clamp(player.x,40,W-40);player.y=clamp(player.y,90,H-45)}}window.addEventListener('resize',resize);resize();
function fresh(){mode='playing';levelLength=2600+level*210;progress=0;elapsed=0;spawnTimer=.5;brickRows=[];balls=[];shots=[];particles=[];boss=null;invuln=0;dash=0;dashCd=0;fireCd=0;flash=0;player={x:W/2,y:H*.72,w:35,h:23,hp:100,max:100};pointer.x=player.x;pointer.y=player.y;overlay.classList.add('hidden')}
function showEnd(won){mode=won?'clear':'dead';overlay.classList.remove('hidden');document.querySelector('#eyebrow').textContent=won?'Guardian defeated':'Run terminated';document.querySelector('#title').innerHTML=won?'SECTOR <span>'+String(level).padStart(2,'0')+'</span> CLEAR':'BRICK<span>//</span>DOWN';document.querySelector('#desc').textContent=won?'The guardian is scrap. Your next sector is faster, tighter, and meaner. Ready to go again?':'The corridor got you. Every hit counts — find the gaps and keep moving. Run score: '+Math.floor(score)+'.';document.querySelector('.keys').innerHTML='<span class="key">SCORE&nbsp; '+score+'</span><span class="key">SECTOR&nbsp; '+level+'</span>';startBtn.innerHTML=won?'NEXT SECTOR&nbsp; ↗':'RETRY RUN&nbsp; ↗'}
startBtn.addEventListener('click',()=>{if(mode==='clear')level++;else if(mode==='menu')level=1;fresh()});
function pointerPos(e){const r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointer.down=true;pointerPos(e)});canvas.addEventListener('pointermove',e=>{if(pointer.down)pointerPos(e)});canvas.addEventListener('pointerup',()=>pointer.down=false);canvas.addEventListener('pointercancel',()=>pointer.down=false);
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='ShiftLeft'||e.code==='ShiftRight')tryDash()});window.addEventListener('keyup',e=>keys[e.code]=false);
function tryDash(){if((mode==='playing'||mode==='boss')&&dashCd<=0){dash=.2;dashCd=2.2;invuln=Math.max(invuln,.42);burst(player.x,player.y,'#62f5e1',12)}}
function burst(x,y,c,n=8){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),s=rand(45,220);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.22,.65),max:.65,c,size:rand(1,3)})}}
function addRow(y){const gapW=Math.max(110,220-level*5),gapX=rand(55,W-55-gapW),thick=rand(22,34),row={y,h:thick,parts:[],gapX,gapW,phase:rand(0,6),speed:rand(.35,.8)};if(Math.random()<.25)row.moving={x:rand(80,W-130),w:rand(55,105),dir:Math.random()<.5?-1:1};if(gapX>24)row.parts.push({x:0,w:gapX});if(gapX+gapW<W-24)row.parts.push({x:gapX+gapW,w:W-gapX-gapW});brickRows.push(row)}
function spawnBall(){let fromLeft=Math.random()<.5;balls.push({x:rand(40,W-40),y:-25,r:rand(8,13),vx:rand(-60,60)+(fromLeft?-25:25),vy:rand(110,175)+level*5,c:colors[Math.floor(Math.random()*colors.length)],spin:rand(0,7)})}
function shoot(){if(fireCd>0)return;fireCd=.19;shots.push({x:player.x,y:player.y-15,vy:-560,r:4});}
function hitPlayer(dmg=1){if(invuln>0||dash>0)return;player.hp-=dmg;invuln=.48;shake=7;flash=.16;burst(player.x,player.y,'#ff648f',9);if(player.hp<=0){player.hp=0;showEnd(false)}}
function damageBoss(n=1){if(!boss)return;boss.hp-=n;boss.flash=.1;score+=10;if(boss.hp<=0){burst(boss.x,boss.y,'#ffcb71',48);score+=500+level*100;showEnd(true)}}
function startBoss(){mode='boss';brickRows=[];balls=[];boss={x:W/2,y:145,r:48,hp:100+level*25,max:100+level*25,age:0,attack:1.2,flash:0,phase:0};}
function fireBoss(){if(!boss)return;const pattern=(level-1)%3;const emit=(a,s=210)=>balls.push({x:boss.x,y:boss.y+boss.r*.55,r:9,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:'#ff648f',spin:0});if(pattern===0){let a=Math.atan2(player.y-boss.y,player.x-boss.x);for(let i=-1;i<=1;i++)emit(a+i*.14,215)}else if(pattern===1){for(let i=0;i<7;i++)emit(Math.PI*.18+i*Math.PI*.64/6,180)}else{for(let i=0;i<5;i++)emit(Math.PI/2+(i-2)*.24,220)} }
function update(dt){elapsed+=dt;shake=Math.max(0,shake-dt*24);flash=Math.max(0,flash-dt);invuln=Math.max(0,invuln-dt);dashCd=Math.max(0,dashCd-dt);dash=Math.max(0,dash-dt);fireCd=Math.max(0,fireCd-dt);
if(mode==='playing'){
 let tx=player.x,ty=player.y;if(pointer.down){tx=pointer.x;ty=pointer.y}else{let sx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),sy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);tx+=sx*350*dt;ty+=sy*350*dt}player.x+=(clamp(tx,30,W-30)-player.x)*Math.min(1,dt*12);player.y+=(clamp(ty,100,H-42)-player.y)*Math.min(1,dt*12);if(pointer.down||keys.Space)shoot();
 let speed=100+level*8;progress+=speed*dt;spawnTimer-=dt;if(spawnTimer<=0){addRow(-40);spawnTimer=rand(.65,1.05)}if(Math.random()<dt*(.35+level*.045))spawnBall();
 for(const row of brickRows){row.y+=speed*dt;row.phase+=dt*row.speed;if(row.moving){row.moving.x+=row.moving.dir*(55+level*3)*dt;if(row.moving.x<24||row.moving.x+row.moving.w>W-24)row.moving.dir*=-1}if(row.y+row.h>player.y-player.h/2&&row.y<player.y+player.h/2){let collide=row.parts.some(p=>player.x+player.w/2>p.x&&player.x-player.w/2<p.x+p.w);if(row.moving&&player.y+player.h/2>row.y-6&&player.y<row.y+row.h+8&&player.x+player.w/2>row.moving.x&&player.x-player.w/2<row.moving.x+row.moving.w)collide=true;if(collide){hitPlayer(4);player.x+=player.x<W/2?-70:70}}}brickRows=brickRows.filter(r=>r.y<H+50);
 if(progress>=levelLength)startBoss();
}
if(mode==='boss'&&boss){let tx=player.x,ty=player.y;if(pointer.down){tx=pointer.x;ty=pointer.y}else{let sx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),sy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);tx+=sx*350*dt;ty+=sy*350*dt}player.x+=(clamp(tx,30,W-30)-player.x)*Math.min(1,dt*12);player.y+=(clamp(ty,100,H-42)-player.y)*Math.min(1,dt*12);if(pointer.down||keys.Space)shoot();boss.age+=dt;boss.flash=Math.max(0,boss.flash-dt);boss.x=W/2+Math.sin(boss.age*.82)*W*.31;boss.y=115+Math.sin(boss.age*1.6)*23;boss.attack-=dt;if(boss.attack<=0){fireBoss();boss.attack=Math.max(.56,1.35-level*.045)}if(boss.age>8&&Math.floor(boss.age/8)>boss.phase){boss.phase=Math.floor(boss.age/8);burst(rand(80,W-80),rand(170,H*.42),'#ffbd5c',8)} }
if(mode==='playing'||mode==='boss'){
 for(const s of shots){s.y+=s.vy*dt;if(boss&&Math.hypot(s.x-boss.x,s.y-boss.y)<boss.r+8){damageBoss(2);s.dead=true}if(!boss){for(const row of brickRows){if(s.y>row.y&&s.y<row.y+row.h){s.dead=true;break}}}}shots=shots.filter(s=>!s.dead&&s.y>-20);
 for(const b of balls){b.x+=b.vx*dt;b.y+=b.vy*dt;b.spin+=dt*4;if(b.x<b.r||b.x>W-b.r)b.vx*=-1;if(boss&&b.y>H+30)b.dead=true;if(!boss&&b.y>H+30)b.dead=true;if(Math.abs(b.x-player.x)<player.w/2+b.r&&Math.abs(b.y-player.y)<player.h/2+b.r){b.dead=true;hitPlayer(1);score+=1}if(boss&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r+b.r){b.dead=true}}
 balls=balls.filter(b=>!b.dead);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.08,dt);p.vy*=Math.pow(.08,dt);p.life-=dt}particles=particles.filter(p=>p.life>0);
 score+=dt*2;
}
}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0b1725');bg.addColorStop(1,'#060d17');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 const offset=(elapsed*32)%44;ctx.lineWidth=1;ctx.strokeStyle='#7fa0bd0d';for(let x=0;x<W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-44+offset;y<H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.fillStyle='#132738';ctx.fillRect(0,0,18,H);ctx.fillRect(W-18,0,18,H);ctx.fillStyle='#62f5e122';ctx.fillRect(18,0,2,H);ctx.fillRect(W-20,0,2,H);for(let i=0;i<16;i++){let y=((i*52+elapsed*90)%(H+52))-26;ctx.fillStyle=i%2?'#62f5e12a':'#ff648f2b';ctx.fillRect(8,y,5,20);ctx.fillRect(W-13,y,5,20)}
 for(let i=0;i<38;i++){let x=(i*173.3+Math.sin(elapsed*.7+i)*22)%W,y=(i*97+elapsed*(18+i%4*6))%H;ctx.fillStyle=`rgba(110,220,225,${.1+(i%4)*.035})`;ctx.fillRect(x,y,2,2)}
 if(mode==='playing'||mode==='boss'||mode==='dead'||mode==='clear'){
  if(mode==='playing')for(const row of brickRows){for(const p of row.parts){ctx.fillStyle='#20384a';ctx.fillRect(p.x,row.y,p.w,row.h);ctx.fillStyle='#36556b';ctx.fillRect(p.x,row.y,p.w,3);ctx.fillStyle='#0c1926';ctx.fillRect(p.x+5,row.y+row.h-4,Math.max(0,p.w-10),2);for(let bx=p.x+12;bx<p.x+p.w-5;bx+=32){ctx.fillStyle='#52738744';ctx.fillRect(bx,row.y+8,18,2)}}if(row.moving){ctx.fillStyle='#bf426b';ctx.fillRect(row.moving.x,row.y-4,row.moving.w,row.h+8);ctx.fillStyle='#ff8da9';ctx.fillRect(row.moving.x,row.y-4,row.moving.w,3)}}
  for(const s of shots){ctx.shadowBlur=14;ctx.shadowColor='#62f5e1';ctx.fillStyle='#b9fff8';ctx.fillRect(s.x-2,s.y-10,4,13);ctx.shadowBlur=0}
  for(const b of balls){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.spin);ctx.shadowBlur=16;ctx.shadowColor=b.c;ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-b.r*.25,-b.r*.28,b.r*.25,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff7';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,b.r+3,0,Math.PI*2);ctx.stroke();ctx.restore()}
  for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.size,p.size);ctx.globalAlpha=1}
  if(boss){ctx.save();ctx.translate(boss.x,boss.y);ctx.shadowBlur=30;ctx.shadowColor=boss.flash?'#fff':'#ff477c';ctx.fillStyle=boss.flash?'#fff':'#7d294d';ctx.beginPath();for(let i=0;i<12;i++){let a=i*Math.PI/6-Math.PI/2,r=i%2?boss.r*.76:boss.r;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ff8eaa';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#f8c5d3';ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#351125';ctx.beginPath();ctx.arc(0,0,11+Math.sin(boss.age*5)*2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff597e';ctx.fillRect(-boss.r*.78,-boss.r*.15,14,7);ctx.fillRect(boss.r*.45,boss.r*.15,14,7);ctx.restore()}
  if(player){ctx.save();ctx.translate(player.x,player.y);if(invuln>0)ctx.globalAlpha=Math.sin(elapsed*45)>0?.35:1;if(dash>0){ctx.shadowBlur=24;ctx.shadowColor='#62f5e1'}else{ctx.shadowBlur=18;ctx.shadowColor='#62f5e1'}ctx.fillStyle='#62f5e1';ctx.fillRect(-player.w/2,-player.h/2,player.w,player.h);ctx.fillStyle='#d5fff9';ctx.fillRect(-player.w/2+4,-player.h/2+4,player.w-8,4);ctx.fillStyle='#163a42';ctx.fillRect(-player.w/2+6,1,player.w-12,5);ctx.fillStyle='#fff';ctx.fillRect(-4,-2,8,2);ctx.shadowBlur=0;ctx.restore();ctx.globalAlpha=1}
  drawHud();
 }
 if(flash>0){ctx.fillStyle=`rgba(255,60,110,${flash*1.6})`;ctx.fillRect(0,0,W,H)}
}
function drawHud(){const pad=30;ctx.textBaseline='top';ctx.font="11px 'DM Mono', monospace";ctx.fillStyle='#7892a7';ctx.fillText('SECTOR '+String(level).padStart(2,'0'),pad,24);ctx.fillStyle='#e2f5f3';ctx.font="600 17px 'Space Grotesk',sans-serif";ctx.fillText(mode==='boss'?'GUARDIAN ENCOUNTER':'DESCENT',pad,43);ctx.textAlign='right';ctx.fillStyle='#9fb4c4';ctx.font="11px 'DM Mono', monospace";ctx.fillText('SCORE  '+String(Math.floor(score)).padStart(6,'0'),W-pad,29);ctx.textAlign='left';
 const bw=Math.min(245,W*.34),bx=pad,by=78;ctx.fillStyle='#142535';ctx.fillRect(bx,by,bw,8);ctx.fillStyle=player&&player.hp<30?'#ff648f':'#62f5e1';ctx.fillRect(bx,by,bw*(player?player.hp/player.max:1),8);ctx.fillStyle='#eff';ctx.font="10px 'DM Mono', monospace";ctx.fillText('HULL  '+(player?Math.ceil(player.hp):0)+' / 100',bx,by+14);
 if(mode==='playing'){const pw=Math.min(220,W*.28),px=W-pw-pad,py=78;ctx.fillStyle='#142535';ctx.fillRect(px,py,pw,5);ctx.fillStyle='#ffbd5c';ctx.fillRect(px,py,pw*clamp(progress/levelLength,0,1),5);ctx.textAlign='right';ctx.fillStyle='#9fb4c4';ctx.fillText('EXIT DISTANCE',W-pad,py+12);ctx.textAlign='left'}
 if(boss){let bw2=Math.min(360,W*.52),bx2=(W-bw2)/2,by2=36;ctx.fillStyle='#271926';ctx.fillRect(bx2,by2,bw2,7);ctx.fillStyle='#ff648f';ctx.fillRect(bx2,by2,bw2*clamp(boss.hp/boss.max,0,1),7);ctx.textAlign='center';ctx.fillStyle='#ff9cb5';ctx.fillText(['THE PREDATOR','THE PRISM','THE SIEGE ENGINE'][(level-1)%3],W/2,18);ctx.textAlign='left'}
 if(dashCd>0){ctx.fillStyle='#15293a';ctx.fillRect(pad,by+36,80,3);ctx.fillStyle='#62f5e1';ctx.fillRect(pad,by+36,80*(1-dashCd/2.2),3);ctx.fillStyle='#728b9d';ctx.fillText('DASH',pad+89,by+31)}else{ctx.fillStyle='#62f5e1';ctx.fillText('DASH READY',pad,by+31)}
 ctx.textAlign='right';ctx.fillStyle='#698395';ctx.fillText('DRAG MOVE  ·  HOLD FIRE  ·  SHIFT DASH',W-pad,H-25);ctx.textAlign='left';
}
function frame(now){const dt=Math.min(.034,(now-last)/1000||0);last=now;if(mode!=='menu'&&mode!=='dead'&&mode!=='clear')update(dt);else elapsed+=dt;ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));draw();ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
